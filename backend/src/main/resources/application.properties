spring.application.name=error-monitor

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/errormonitor}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Akshi@2325}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.config.import=optional:application-local.properties

# Server Port
server.port=${PORT:8080}

spring.security.enabled=false

groq.api.key=${GROQ_API_KEY:your_api_key}